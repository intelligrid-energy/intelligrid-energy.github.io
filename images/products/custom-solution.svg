<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1428"/><stop offset="100%" stop-color="#16294a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg8)"/>
  <!-- central gear -->
  <g transform="translate(200,150)">
    <circle r="45" fill="none" stroke="#2dd4bf" stroke-width="4"/>
    <circle r="18" fill="#0f1e38" stroke="#5eead4" stroke-width="3"/>
    <g stroke="#2dd4bf" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-58" x2="0" y2="-45"/><line x1="0" y1="58" x2="0" y2="45"/>
      <line x1="-58" y1="0" x2="-45" y2="0"/><line x1="58" y1="0" x2="45" y2="0"/>
      <line x1="-41" y1="-41" x2="-32" y2="-32"/><line x1="41" y1="41" x2="32" y2="32"/>
      <line x1="-41" y1="41" x2="-32" y2="32"/><line x1="41" y1="-41" x2="32" y2="-32"/>
    </g>
  </g>
  <!-- smaller connected gear -->
  <g transform="translate(280,90)">
    <circle r="24" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <circle r="9" fill="#0f1e38" stroke="#3b82f6" stroke-width="2"/>
    <g stroke="#3b82f6" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-24"/><line x1="0" y1="30" x2="0" y2="24"/>
      <line x1="-30" y1="0" x2="-24" y2="0"/><line x1="30" y1="0" x2="24" y2="0"/>
    </g>
  </g>
</svg>
